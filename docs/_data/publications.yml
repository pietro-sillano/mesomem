# Publications page.
#
# Each entry:
#   - year: 2027
#     type: Paper            # Paper, Preprint, Thesis, ...
#     title: "Title of the work"
#     authors: "A. Author, B. Author"
#     venue: "*Journal* **1**, 123"      # Markdown
#     links:
#       - label: Paper
#         url: https://doi.org/...
#
# `mesomem` holds the MesoMem paper itself; `using` holds work by others that uses the model.
# While `using` is empty, the page shows a short "contact us" note instead.

mesomem:
  - year: 2026
    type: Paper
    title: "MesoMem: A mesoscale membrane model based on an additive potential"
    authors: "P. Sillano, S. J. Marrink, T. Idema"
    venue: "*Phys. Rev. E* **114**, 034412"
    links:
      - label: Paper
        url: https://doi.org/10.1103/4dhv-8xd7
      - label: arXiv
        url: https://arxiv.org/abs/2602.24123

using: []
