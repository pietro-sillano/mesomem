<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="shell">
    {% include sidebar.html %}

    <div class="content">
      {% include nav.html %}

      {% if page.membrane %}
      <div class="membrane">
        <canvas id="membrane" role="img" aria-label="Animated cross-section of a MesoMem membrane: a row of oriented particles that bends around the cursor"></canvas>
      </div>
      {% endif %}

      <main>
        {{ content }}
      </main>
    </div>
  </div>

  {% if page.membrane %}
  <script src="{{ '/assets/js/membrane.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
